name: Docker Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: panel
            file: deploy/Dockerfile
            build_target: panel
            tags: vortexuipro-panel
          - name: web
            file: deploy/web.Dockerfile
            build_target: ''
            tags: vortexuipro-web
          - name: node
            file: deploy/Dockerfile
            build_target: node
            tags: vortexuipro-node
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION 2>/dev/null || echo '0.0.1')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.build_target }}
          push: false
          tags: ${{ matrix.tags }}:${{ steps.ver.outputs.version }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true

      - name: Run Trivy on ${{ matrix.name }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.tags }}:${{ steps.ver.outputs.version }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          hide-progress: true
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Upload Trivy results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.sarif
