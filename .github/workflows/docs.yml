# ═══════════════════════════════════════════════════════════════════════
# VortexUiPro — Documentation Site (MkDocs → GitHub Pages) 📖
#
# Builds the MkDocs documentation site and deploys it to GitHub Pages.
#
# Triggers:
#   - Push to master with changes in docs/ or mkdocs.yml
#   - Manual workflow_dispatch
#
# Required Settings:
#   Settings → Pages → Source: GitHub Actions
#
# ═══════════════════════════════════════════════════════════════════════

name: 📖 Docs (MkDocs → GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Explicit permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # ← needed for git-revision-date-localized

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with MkDocs
        run: |
          mkdocs build --site-dir "${{ runner.temp }}/site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ runner.temp }}/site"

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: success()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Telegram notification
        if: always() && secrets.TELEGRAM_BOT_TOKEN
        env:
          STATUS: ${{ job.status }}
        run: |
          EMOJI="$([ '${{ job.status }}' = 'success' ] && echo '✅' || echo '❌')"
          MESSAGE="${EMOJI} <b>VortexUiPro Docs Deploy</b>
          Status: ${{ job.status }}
          URL: https://ipmartnetwork.github.io/VortexUiPro
          Trigger: ${{ github.event_name }}"

          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo '⚠️ Telegram notification failed'
