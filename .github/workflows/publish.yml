name: Publish Docker Images

# Triggered automatically when a GitHub Release is published,
# or manually to republish a specific version tag.
#
# Builds and pushes all three images (panel, node, web) as
# multi-arch (linux/amd64 + linux/arm64) to GHCR.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v0.1.1)'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GOTOOLCHAIN: local

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: panel
            file: deploy/Dockerfile
            build_target: panel
          - name: node
            file: deploy/Dockerfile
            build_target: node
          - name: web
            file: deploy/web.Dockerfile
            build_target: ''

    steps:
      - uses: actions/checkout@v5

      # ── Resolve version ─────────────────────────────────────────
      - name: Get version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.version }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # ── Image name (lowercase owner) ────────────────────────────
      - name: Set image name
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/vortexuipro-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # ── Docker setup ─────────────────────────────────────────────
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      # ── Metadata ─────────────────────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest
          flavor: latest=false

      # ── Build & push ─────────────────────────────────────────────
      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.build_target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=publish-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.name }},ignore-error=true
