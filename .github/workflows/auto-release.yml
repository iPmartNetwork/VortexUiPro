# ═══════════════════════════════════════════════════════════════════════
# VortexUiPro — Auto Release 🚀
#
# Triggers:
#   - Tag push:  v* (e.g. v0.1.0, v1.0.0-beta)
#   - Manual:    workflow_dispatch
#
# Produces:
#   ✅ Cross-platform binaries  (GoReleaser)
#   🐳 Docker images:
#       vortexuipro-panel  (GoReleaser)
#       vortexuipro-node   (GoReleaser)
#       vortexuipro-web    (separate job — Caddy/SPA, not a Go binary)
#   📝 GitHub Release with changelog + checksums
#   📨 Telegram notification (optional)
#
# Required Secrets:
#   GHCR_PAT           — PAT with packages:write
#   TELEGRAM_BOT_TOKEN — (optional)
#   TELEGRAM_CHAT_ID   — (optional)
# ═══════════════════════════════════════════════════════════════════════

name: 🚀 Auto Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.1)'
        required: true
        type: string
      skip_docker:
        description: 'Skip Docker builds'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # GitHub Release
  packages: write   # GHCR push
  id-token: write   # cosign keyless

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"

# ─────────────────────────────────────────────────────────────────────
jobs:
  # ═══════════════════════════════════════════════════════════════════
  # 1️⃣  Build frontend — output uploaded as artifact for GoReleaser
  # ═══════════════════════════════════════════════════════════════════
  frontend:
    name: 🎨 Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: npm ci && npm run build

      - name: Upload web/dist
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════
  # 2️⃣  GoReleaser — binaries + panel/node Docker images
  # ═══════════════════════════════════════════════════════════════════
  goreleaser:
    name: 🏗️ GoReleaser
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version }}"
            # Create the tag locally so GoReleaser can find it
            git tag "${TAG}" || true
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Restore frontend build for GoReleaser docker extra_files
      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # Migrations dir must exist (GoReleaser docker extra_files)
      - name: Ensure migrations dir exists
        run: mkdir -p migrations

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      # Pre-flight: verify Go can build the project
      - name: Verify Go build
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: go build ./cmd/panel ./cmd/agent ./cmd/gencerts

      - name: Set lowercase registry owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install GoReleaser
        run: |
          curl -sSLf "https://github.com/goreleaser/goreleaser/releases/download/v2.1.0/goreleaser_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin goreleaser
          goreleaser --version

      - name: GoReleaser
        id: goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_OWNER: ${{ steps.owner.outputs.value }}
          GOTOOLCHAIN: local
        run: |
          goreleaser release --clean --timeout 90m --skip=docker,docker_manifests 2>&1 || (echo "GoReleaser failed with exit $?"; exit 1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_OWNER: ${{ steps.owner.outputs.value }}
          GOTOOLCHAIN: local

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Telegram notification
        if: always()
        run: |
          [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && exit 0
          EMOJI="$([ '${{ job.status }}' = 'success' ] && echo '✅' || echo '❌')"
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${EMOJI} VortexUiPro ${{ steps.tag.outputs.tag }} release: ${{ job.status }}" \
            -d "parse_mode=HTML" || true

  # ═══════════════════════════════════════════════════════════════════
  # 3️⃣  Web Docker — Caddy + SPA image (multi-arch, parallel)
  # ═══════════════════════════════════════════════════════════════════
  web-docker:
    name: 🌐 Web Docker
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_docker }}
    needs: [frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Set image name (lowercase owner)
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/vortexuipro-web" >> "$GITHUB_OUTPUT"

      - name: Build and push web image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.tag }}
            ${{ steps.img.outputs.name }}:latest
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=web-release
          cache-to: type=gha,mode=max,scope=web-release,ignore-error=true

  # ═══════════════════════════════════════════════════════════════════
  # 4️⃣  Summary
  # ═══════════════════════════════════════════════════════════════════
  summary:
    name: 📋 Summary
    runs-on: ubuntu-latest
    needs: [goreleaser, web-docker]
    if: ${{ !cancelled() }}
    steps:
      - name: Write summary
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🚀 VortexUiPro Release

          | Job | Result |
          |-----|--------|
          | GoReleaser (binaries + panel + node) | ${{ needs.goreleaser.result }} |
          | Web Docker | ${{ needs.web-docker.result }} |

          ### Docker Images
          - \`ghcr.io/${OWNER}/vortexuipro-panel:${{ github.ref_name }}\`
          - \`ghcr.io/${OWNER}/vortexuipro-node:${{ github.ref_name }}\`
          - \`ghcr.io/${OWNER}/vortexuipro-web:${{ github.ref_name }}\`
          EOF
