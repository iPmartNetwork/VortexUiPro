name: 🚀 Auto Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v0.1.2)'
        required: true
        type: string
      skip_docker:
        description: 'Skip Docker builds'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  release:
    name: 📦 Build & Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}"        >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"  >> "$GITHUB_OUTPUT"

      # ── Build Frontend first so it gets embedded ──────────────
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      # ── Build Go binaries with embedded UI ────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build cross-platform binaries
        env:
          CGO_ENABLED: "0"
        run: |
          VER="${{ steps.ver.outputs.version }}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VER} -X main.commit=${COMMIT} -X main.date=${DATE}"
          mkdir -p dist

          build() {
            local OS=$1 ARCH=$2 SUFFIX=$3
            echo "▶ Building ${OS}/${ARCH}..."
            GOOS=${OS} GOARCH=${ARCH} go build -trimpath -ldflags "${LDFLAGS}" \
              -o "dist/vortexuipro-${OS}-${ARCH}${SUFFIX}" ./cmd/panel
            GOOS=${OS} GOARCH=${ARCH} go build -trimpath -ldflags "${LDFLAGS}" \
              -o "dist/vortexuipro-agent-${OS}-${ARCH}${SUFFIX}" ./cmd/agent || true
          }

          build linux  amd64 ""
          build linux  arm64 ""
          build darwin amd64 ""
          build darwin arm64 ""
          build windows amd64 ".exe"

          cd dist
          for f in vortexuipro-linux-* vortexuipro-agent-linux-* vortexuipro-darwin-*; do
            [ -f "$f" ] && tar -czf "${f}.tar.gz" "$f" && rm "$f"
          done
          for f in vortexuipro-windows-*.exe; do
            [ -f "$f" ] && zip "${f%.exe}.zip" "$f" && rm "$f"
          done
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "VortexUiPro ${{ steps.ver.outputs.tag }}"
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  docker:
    name: 🐳 Docker ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ !inputs.skip_docker }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: panel
            file: deploy/Dockerfile
            target: panel
          - name: node
            file: deploy/Dockerfile
            target: node
          - name: web
            file: deploy/web.Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v5

      - name: Set image name
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/vortexuipro-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.release.outputs.version }}
            ${{ steps.img.outputs.name }}:${{ needs.release.outputs.tag }}
            ${{ steps.img.outputs.name }}:latest
          build-args: VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }},ignore-error=true
