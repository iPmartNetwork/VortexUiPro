# ═══════════════════════════════════════════════════════════════════════
# VortexUiPro — Release (Legacy)
#
# 🚫 DEPRECATED — Use auto-release.yml instead
#
# This workflow is kept for backward compatibility and redirects to
# the new GoReleaser-based auto-release workflow.
#
# The new workflow (auto-release.yml) provides:
#   ✅ GoReleaser cross-platform builds (linux/mac/windows × amd64/arm64)
#   🐳 Docker multi-arch build + push to GHCR
#   📝 Auto GitHub Release with changelog
#   🧪 SBOM generation (SPDX)
#   🔐 Cosign signing
#   🔎 Trivy vulnerability scan
#
# ═══════════════════════════════════════════════════════════════════════

name: Release (Legacy)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.23"

jobs:
  redirect:
    name: ⚡ Redirect to Auto-Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trigger auto-release workflow
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ github.event.inputs.version || github.ref_name }}';
            console.log(`🔄 Redirecting release ${version} to auto-release workflow...`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-release.yml',
              ref: 'master',
              inputs: {
                version: version,
                pre_release: 'false',
                skip_docker: 'false',
                skip_scan: 'false'
              }
            });

            core.summary.addHeading('🔄 Redirected to Auto-Release')
              .addRaw(`
                <p>This legacy workflow has been superseded by <strong>auto-release.yml</strong>.</p>
                <p>Release version: <code>${version}</code></p>
                <p>✅ The new GoReleaser workflow has been triggered!</p>
              `);

      - name: Build cross-platform binaries (legacy fallback)
        if: ${{ failure() }}
        run: |
          echo "⚠️ Auto-release workflow failed — falling back to legacy build..."
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::8} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for os in linux darwin; do
            for arch in amd64 arm64; do
              out="vortexuipro-${os}-${arch}"
              CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath \
                -ldflags "${LDFLAGS}" \
                -o "dist/${out}" ./cmd/panel
              tar -C dist -czf "dist/${out}.tar.gz" "${out}"
              rm "dist/${out}"
            done
          done

          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Create GitHub Release (legacy fallback)
        if: ${{ failure() }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            # VortexUiPro ${{ github.ref_name }}

            > ⚠️ Built with legacy workflow — switch to GoReleaser for improved builds.

            ## 📦 Downloads
            | OS | Arch | Link |
            |----|------|------|
            | Linux | amd64 | `vortexuipro-linux-amd64.tar.gz` |
            | Linux | arm64 | `vortexuipro-linux-arm64.tar.gz` |
            | macOS | amd64 | `vortexuipro-darwin-amd64.tar.gz` |
            | macOS | arm64 | `vortexuipro-darwin-arm64.tar.gz` |

            See [CHANGELOG.md](CHANGELOG.md) for full release notes.
          files: |
            dist/*.tar.gz
            dist/checksums.txt
