name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.23"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build cross-platform binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::8} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for os in linux darwin; do
            for arch in amd64 arm64; do
              # Panel binary
              out="vortexuipro-${os}-${arch}"
              CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath \
                -ldflags "${LDFLAGS}" \
                -o "dist/${out}" ./cmd/panel
              tar -C dist -czf "dist/${out}.tar.gz" "${out}"
              rm "dist/${out}"

              # Agent binary
              if [ -d ./cmd/agent ]; then
                agent_out="vortexuipro-agent-${os}-${arch}"
                CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath \
                  -ldflags "${LDFLAGS}" \
                  -o "dist/${agent_out}" ./cmd/agent
                tar -C dist -czf "dist/${agent_out}.tar.gz" "${agent_out}"
                rm "dist/${agent_out}"
              fi
            done
          done

          # Generate checksums
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Build SBOM
        run: |
          go install github.com/anchore/syft/cmd/syft@latest
          syft dir:. -o spdx-json=dist/sbom.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            # VortexUiPro ${{ github.ref_name }}

            ## 📦 Downloads
            | OS | Arch | Link |
            |----|------|------|
            | Linux | amd64 | `vortexuipro-linux-amd64.tar.gz` |
            | Linux | arm64 | `vortexuipro-linux-arm64.tar.gz` |
            | macOS | amd64 | `vortexuipro-darwin-amd64.tar.gz` |
            | macOS | arm64 | `vortexuipro-darwin-arm64.tar.gz` |

            ## 🐳 Docker Images
            - `ghcr.io/ipmartnetwork/vortexuipro-panel:${{ github.ref_name }}`
            - `ghcr.io/ipmartnetwork/vortexuipro-web:${{ github.ref_name }}`
            - `ghcr.io/ipmartnetwork/vortexuipro-node:${{ github.ref_name }}`

            ## 🔐 Checksums
            See `checksums.txt` in assets.

            ## 🧪 SBOM
            Software Bill of Materials: `sbom.spdx.json`

            See [CHANGELOG.md](CHANGELOG.md) for full release notes.
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/sbom.spdx.json
