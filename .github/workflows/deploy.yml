# ═══════════════════════════════════════════════════════════════════════
# VortexUiPro — Auto Deploy via SSH 🚀
#
# Triggers on:
#   - Push to master (after CI passes)
#   - Manual workflow_dispatch (with environment selection)
#   - Tag push (production deploy)
#
# Deploys to:
#   - Staging  → staging-server.example.com
#   - Production → production-server.example.com
#
# Required GitHub Secrets:
#   SSH_PRIVATE_KEY       — SSH private key for server access
#   SSH_KNOWN_HOSTS       — Server SSH host key (run: ssh-keyscan -H server.com)
#   DEPLOY_USER           — SSH username
#   STAGING_HOST          — Staging server hostname/IP
#   PRODUCTION_HOST       — Production server hostname/IP
#   TELEGRAM_BOT_TOKEN    — Bot token for deployment notifications
#   TELEGRAM_CHAT_ID      — Chat ID for notifications
#
# ═══════════════════════════════════════════════════════════════════════

name: 🚀 Auto Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Docker image tag (optional, default: latest)'
        required: false
        default: 'latest'
      skip_ci:
        description: 'Skip CI checks and deploy directly'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write        # ← needed for Docker push to GHCR
  deployments: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # 🔍 Validation — runs CI checks before deploy (unless --skip-ci)
  # ═══════════════════════════════════════════════════════════════════
  validate:
    name: 🔍 Validate
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.skip_ci }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc

      - name: Lint (Go)
        env:
          GOTOOLCHAIN: local
        run: go vet ./...

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint (Frontend)
        working-directory: web
        run: |
          npm ci
          npx eslint --ext .ts,.tsx src/ --max-warnings=50 || true
          npx tsc --noEmit --pretty || true

      - name: Test (Go)
        run: CGO_ENABLED=1 go test -count=1 -cover ./... 2>&1 | tail -5

      - name: Build (Frontend)
        working-directory: web
        run: npm run build

  # ═══════════════════════════════════════════════════════════════════
  # 🐳 Docker Build — builds and pushes multi-arch images to GHCR
  # ═══════════════════════════════════════════════════════════════════
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ !cancelled() && (success() || github.event.inputs.skip_ci) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: panel
            file: deploy/Dockerfile
            target: panel
          - name: web
            file: deploy/web.Dockerfile
            target: ''
          - name: node
            file: deploy/Dockerfile
            target: node
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: ver
        run: echo "version=$(cat VERSION 2>/dev/null || echo '0.0.1')" >> "$GITHUB_OUTPUT"

      - name: Set image name (lowercase)
        id: img
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vortexuipro-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.event.inputs.version || 'latest' }}
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true

  # ═══════════════════════════════════════════════════════════════════
  # 📦 Deploy — SSH into server and orchestrate deployment
  # ═══════════════════════════════════════════════════════════════════
  deploy:
    name: 📦 Deploy
    runs-on: ubuntu-latest
    needs: [docker]
    if: ${{ !cancelled() && (success() || github.event.inputs.skip_ci) }}
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine target host
        id: target
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ENV="production"
          fi
          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"

          if [[ "${ENV}" == "production" ]]; then
            echo "host=${PRODUCTION_HOST}" >> "$GITHUB_OUTPUT"
          else
            echo "host=${STAGING_HOST}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'EOF'
          Host vortex-deploy
            HostName ${{ steps.target.outputs.host }}
            User ${{ secrets.DEPLOY_USER || 'root' }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF

      - name: Test SSH connection
        run: |
          ssh vortex-deploy "echo '✅ SSH connection successful' && hostname && uptime"

      - name: Deploy to server
        run: |
          echo '🚀 Deploying via deploy.sh...'
          ssh vortex-deploy "
            set -euo pipefail

            # Clone project if first time setup
            PROJECT_DIR=\"/opt/vortexuipro\"
            if [ ! -d \"\${PROJECT_DIR}\" ]; then
              echo '📦 First-time setup: cloning repository...'
              git clone https://github.com/${{ github.repository }}.git \"\${PROJECT_DIR}\"
            fi

            # Run the deployment script
            VORTEX_ENV=${{ steps.target.outputs.environment }} \
            VORTEX_VERSION=${{ github.event.inputs.version || 'latest' }} \
            VORTEX_PROJECT=\"\${PROJECT_DIR}\" \
            VORTEX_BACKUP=true \
            bash \"\${PROJECT_DIR}/deploy/scripts/deploy.sh\"
          "

      - name: Verify deployment
        run: |
          sleep 5
          ssh vortex-deploy "
            echo '🔍 Verifying deployment...'
            # Check all services are running
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null || true

            # Test API health
            echo ''
            echo '📡 Testing API health...'
            curl -sf http://localhost:8080/api/v1/health 2>/dev/null && echo '✅ API health check passed' || echo '⚠️  API health check failed'

            # Show recent logs
            echo ''
            echo '📋 Recent panel logs:'
            docker logs vortexuipro-panel --tail 5 2>/dev/null || true
          "

      - name: Send Telegram notification
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          EMOJI="$([ '${{ job.status }}' = 'success' ] && echo '✅' || echo '❌')"
          MESSAGE="${EMOJI} <b>VortexUiPro Deploy</b>
          Environment: ${{ steps.target.outputs.environment }}
          Version: ${{ github.event.inputs.version || 'latest' }}
          Commit: <code>${GITHUB_SHA::8}</code>
          Status: ${{ job.status }}
          Trigger: ${{ github.event_name }}
          By: ${{ github.actor }}
          "
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo '⚠️ Telegram notification failed'
