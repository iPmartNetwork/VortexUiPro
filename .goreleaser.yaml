# ═══════════════════════════════════════════════════════════════════════
# VortexUiPro — GoReleaser v2 Configuration
#
# Builds:  panel (linux/mac/win × amd64+arm64)
#          agent (linux × amd64+arm64)
#          gencerts (linux/mac/win × amd64+arm64)
#
# Docker:  vortexuipro-panel  (amd64 + arm64 → multi-arch manifest)
#          vortexuipro-node   (amd64 + arm64 → multi-arch manifest)
#          (vortexuipro-web is built separately — it's a Node/Caddy image)
#
# NOTE: web/dist must be present before goreleaser runs.
#       The CI workflow downloads it from the frontend build artifact.
# ═══════════════════════════════════════════════════════════════════════

version: 2

project_name: vortexuipro

env:
  - GOTOOLCHAIN=local
  - CGO_ENABLED=0

before:
  hooks:
    - go mod download

# ═══════════════════════════════════════════════════════════════════════
# 🏗️ Builds
# ═══════════════════════════════════════════════════════════════════════
builds:
  - id: panel
    main: ./cmd/panel
    binary: vortexuipro
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: agent
    main: ./cmd/agent
    binary: vortexuipro-agent
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: gencerts
    main: ./cmd/gencerts
    binary: vortexuipro-gencerts
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

# ═══════════════════════════════════════════════════════════════════════
# 📦 Archives
# ═══════════════════════════════════════════════════════════════════════
archives:
  - id: default
    builds: [panel, agent, gencerts]
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    name_template: >-
      {{ .ProjectName }}-{{ .Tag }}-
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - install.sh
      - deploy/compose.yml
      - deploy/production.yml
      - deploy/scripts/*

# ═══════════════════════════════════════════════════════════════════════
# ✅ Checksums
# ═══════════════════════════════════════════════════════════════════════
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# ═══════════════════════════════════════════════════════════════════════
# 🐳 Docker images  (panel + node only — web is built separately)
# ═══════════════════════════════════════════════════════════════════════
dockers:
  # ── panel amd64 ──────────────────────────────────────────────────
  - id: panel-amd64
    ids: [panel]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: deploy/Dockerfile.goreleaser
    target: panel
    image_templates:
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Tag }}-amd64"
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Major }}.{{ .Minor }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.REGISTRY_OWNER }}/VortexUiPro"
    extra_files:
      - deploy/scripts
      - migrations
      - install.sh
      - web/dist

  # ── panel arm64 ──────────────────────────────────────────────────
  - id: panel-arm64
    ids: [panel]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: deploy/Dockerfile.goreleaser
    target: panel
    image_templates:
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Tag }}-arm64"
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Major }}.{{ .Minor }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.REGISTRY_OWNER }}/VortexUiPro"
    extra_files:
      - deploy/scripts
      - migrations
      - install.sh
      - web/dist

  # ── node amd64 ───────────────────────────────────────────────────
  - id: node-amd64
    ids: [agent]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: deploy/Dockerfile.goreleaser
    target: node
    image_templates:
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-node:{{ .Tag }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    extra_files:
      - deploy/scripts

  # ── node arm64 ───────────────────────────────────────────────────
  - id: node-arm64
    ids: [agent]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: deploy/Dockerfile.goreleaser
    target: node
    image_templates:
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-node:{{ .Tag }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    extra_files:
      - deploy/scripts

# ═══════════════════════════════════════════════════════════════════════
# 🖼️ Docker manifests  (multi-arch)
# ═══════════════════════════════════════════════════════════════════════
docker_manifests:
  - id: panel-tag
    name_template: "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Tag }}"
    image_templates:
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Tag }}-amd64"
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Tag }}-arm64"

  - id: panel-latest
    name_template: "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:latest"
    image_templates:
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Tag }}-amd64"
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Tag }}-arm64"

  - id: panel-minor
    name_template: "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Major }}.{{ .Minor }}-arm64"

  - id: node-tag
    name_template: "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-node:{{ .Tag }}"
    image_templates:
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-node:{{ .Tag }}-amd64"
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-node:{{ .Tag }}-arm64"

  - id: node-latest
    name_template: "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-node:latest"
    image_templates:
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-node:{{ .Tag }}-amd64"
      - "ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-node:{{ .Tag }}-arm64"

# ═══════════════════════════════════════════════════════════════════════
# 🚀 GitHub Release
# ═══════════════════════════════════════════════════════════════════════
release:
  github:
    owner: "{{ .Env.REGISTRY_OWNER }}"
    name: VortexUiPro
  prerelease: auto
  mode: replace
  header: |
    # 🚀 VortexUiPro {{ .Tag }}

    > Released: {{ .Date }}

    ## 📥 Binary Downloads

    | OS | Arch | File |
    |----|------|------|
    | Linux | amd64 | `vortexuipro-{{ .Tag }}-linux-x86_64.tar.gz` |
    | Linux | arm64 | `vortexuipro-{{ .Tag }}-linux-arm64.tar.gz` |
    | macOS | amd64 | `vortexuipro-{{ .Tag }}-macOS-x86_64.tar.gz` |
    | macOS | arm64 | `vortexuipro-{{ .Tag }}-macOS-arm64.tar.gz` |
    | Windows | amd64 | `vortexuipro-{{ .Tag }}-windows-x86_64.zip` |

    ## 🐳 Docker Images

    ```bash
    # Panel (web UI + API)
    docker pull ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-panel:{{ .Tag }}

    # Node agent
    docker pull ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-node:{{ .Tag }}

    # Web (Caddy SPA)
    docker pull ghcr.io/{{ .Env.REGISTRY_OWNER }}/vortexuipro-web:{{ .Tag }}
    ```

    ## 🔐 Verify checksums
    ```bash
    sha256sum -c checksums.txt
    ```

    ---
    ### 📋 Changelog

  footer: |
    ---
    > 🤖 Built with [GoReleaser](https://goreleaser.com)

# ═══════════════════════════════════════════════════════════════════════
# 🔧 Changelog
# ═══════════════════════════════════════════════════════════════════════
changelog:
  use: github
  sort: asc
  groups:
    - title: "🚀 Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: "⚡ Performance"
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: "📝 Documentation"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 3
    - title: "🧹 Chores"
      regexp: "^.*chore[(\\w)]*:+.*$"
      order: 4
    - title: "🔧 Other Changes"
      order: 999
  filters:
    exclude:
      - "^bump:"
      - "^docs:"
      - "^chore\\(deps\\):"
      - "^Merge branch"

# ═══════════════════════════════════════════════════════════════════════
# 🧪 Snapshot
# ═══════════════════════════════════════════════════════════════════════
snapshot:
  name_template: "{{ incpatch .Version }}-next"

dist: dist

announce:
  skip: "true"
