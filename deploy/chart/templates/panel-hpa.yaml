{{- if .Values.panel.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "vortexuipro.fullname" . }}-panel
  labels:
    {{- include "vortexuipro.labels" . | nindent 4 }}
    app.kubernetes.io/component: panel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "vortexuipro.fullname" . }}-panel
  minReplicas: {{ .Values.panel.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.panel.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.panel.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.panel.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.panel.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.panel.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- if .Values.panel.autoscaling.customMetrics }}
    {{- toYaml .Values.panel.autoscaling.customMetrics | nindent 4 }}
    {{- end }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
{{- end }}
