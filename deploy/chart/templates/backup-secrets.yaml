{{- if .Values.backup.s3.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vortexuipro.fullname" . }}-backup-s3
  labels:
    {{- include "vortexuipro.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
type: Opaque
data:
  secret-key: {{ .Values.backup.s3.secretKey | b64enc | quote }}
{{- end }}
{{- if .Values.backup.telegram.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vortexuipro.fullname" . }}-backup-telegram
  labels:
    {{- include "vortexuipro.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
type: Opaque
data:
  bot-token: {{ .Values.backup.telegram.botToken | b64enc | quote }}
  chat-id: {{ .Values.backup.telegram.chatId | b64enc | quote }}
{{- end }}
