# ═══════════════════════════════════════════════════════════════════════
# VortexUiPro — Logrotate Configuration
#
# Place this file at:
#   /etc/logrotate.d/vortexuipro
#
# Test:  logrotate -d /etc/logrotate.d/vortexuipro
# Force: logrotate -f /etc/logrotate.d/vortexuipro
# ═══════════════════════════════════════════════════════════════════════

# ─── Panel Application Logs ───────────────────────────────────────────
/var/log/vortexuipro/*.log {
    daily
    rotate 14
    compress
    compresscmd /usr/bin/zstd
    compressext .zst
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    maxage 30
    maxsize 100M
    minsize 1M
    create 0640 vortexuipro vortexuipro
    sharedscripts
    postrotate
        # Signal the panel to reopen log files
        /bin/kill -HUP $(cat /var/run/vortexuipro.pid 2>/dev/null) 2>/dev/null || true
    endscript
}

# ─── Xray Core Logs ──────────────────────────────────────────────────
/var/log/vortexuipro/xray/*.log {
    daily
    rotate 7
    compress
    compresscmd /usr/bin/zstd
    compressext .zst
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    maxage 14
    maxsize 200M
    minsize 1M
    create 0640 vortexuipro vortexuipro
}

# ─── Caddy Access Logs ────────────────────────────────────────────────
/var/log/vortexuipro/caddy/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    maxage 30
    maxsize 100M
    minsize 1M
    create 0640 caddy caddy
    sharedscripts
    postrotate
        /bin/kill -USR1 $(cat /var/run/caddy.pid 2>/dev/null) 2>/dev/null || true
    endscript
}

# ─── Nginx Reverse Proxy Logs (if used instead of Caddy) ─────────────
/var/log/nginx/vortexuipro-*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    maxage 30
    maxsize 200M
    minsize 1M
    create 0640 www-data adm
    sharedscripts
    postrotate
        nginx -s reopen 2>/dev/null || true
    endscript
}
