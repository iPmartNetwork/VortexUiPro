syntax = "proto3";
package vortexcluster;

option go_package = "vortexuipro/internal/cluster/pb";

// ─── Cluster Mesh Service ────────────────────────────────────────────
// gRPC service for peer-to-peer cluster communication with
// bidirectional streaming for heartbeats, data sync, and log replication.

service ClusterMesh {
  // Unary: Handshake and identity exchange on connect
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);

  // Bidirectional streaming: heartbeat + election messages
  rpc HeartbeatStream(stream HeartbeatMessage) returns (stream HeartbeatMessage);

  // Bidirectional streaming: data synchronization
  rpc SyncStream(stream SyncMessage) returns (stream SyncMessage);

  // Unary: Request full data sync from leader
  rpc RequestFullSync(FullSyncRequest) returns (FullSyncResponse);
}

// ─── Handshake ───────────────────────────────────────────────────────

message HandshakeRequest {
  int64 node_id = 1;
  string node_name = 2;
  string version = 3;
  int64 term = 4;
  int32 priority = 5;
  string region = 6;
  string addr = 7;             // mesh address
  string advertised_addr = 8;  // public address for other nodes to connect
}

message HandshakeResponse {
  bool accepted = 1;
  int64 leader_id = 2;
  string leader_name = 3;
  int64 term = 4;
  string message = 5;
}

// ─── Heartbeat / Election ────────────────────────────────────────────

message HeartbeatMessage {
  int64 sender_id = 1;
  string sender_name = 2;
  int64 timestamp = 3;
  int64 term = 4;

  oneof payload {
    HeartbeatData heartbeat = 10;
    VoteRequest vote_request = 11;
    VoteResult vote_result = 12;
    LeaderAnnounce leader_announce = 13;
  }
}

message HeartbeatData {
  string role = 1;
  string status = 2;
  double cpu_load = 3;
  double mem_used = 4;
  int32 user_count = 5;
  string version = 6;
  string region = 7;
}

message VoteRequest {
  int64 candidate_id = 1;
  string candidate_name = 2;
  int32 priority = 3;
  int64 term = 4;
}

message VoteResult {
  int64 voter_id = 1;
  int64 term = 2;
  bool granted = 3;
}

message LeaderAnnounce {
  int64 leader_id = 1;
  string leader_name = 2;
  int64 term = 3;
  string addr = 4;
}

// ─── Data Sync ───────────────────────────────────────────────────────

message SyncMessage {
  int64 sender_id = 1;
  string sender_name = 2;
  int64 timestamp = 3;

  string data_type = 4;   // users, traffic, inbounds, clients, settings, bans
  string operation = 5;   // create, update, delete
  string entity_id = 6;
  bytes data = 7;

  // Full sync payload
  FullSyncData full_data = 10;
  SyncAck ack = 11;
}

message SyncAck {
  bool success = 1;
  string error = 2;
  string entity_id = 3;
}

message FullSyncData {
  repeated UserData users = 1;
  repeated ClientData clients = 2;
  repeated InboundData inbounds = 3;
  repeated SettingData settings = 4;
}

message UserData {
  int64 id = 1;
  int64 admin_id = 2;
  string username = 3;
  string email = 4;
  string status = 5;
  int64 traffic_up = 6;
  int64 traffic_down = 7;
  int64 data_limit = 8;
  int64 expiry_time = 9;
}

message ClientData {
  string id = 1;
  int64 user_id = 2;
  int64 inbound_id = 3;
  string email = 4;
  bool enable = 5;
  int64 total_gb = 6;
  int64 expiry_time = 7;
}

message InboundData {
  int64 id = 1;
  string tag = 2;
  string protocol = 3;
  int32 port = 4;
  string status = 5;
  bool enable = 6;
  int64 up = 7;
  int64 down = 8;
}

message SettingData {
  string key = 1;
  string value = 2;
}

message FullSyncRequest {
  int64 node_id = 1;
  string node_name = 2;
  int64 timestamp = 3;
}

message FullSyncResponse {
  FullSyncData data = 1;
  int64 leader_id = 2;
  int64 term = 3;
}
