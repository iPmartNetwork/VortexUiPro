# ═══════════════════════════════════════════════════════════════════════
# VortexUiPro — MkDocs Configuration 📖
#
# Generates a beautiful documentation site with Material for MkDocs.
# Deployed automatically to GitHub Pages via docs.yml workflow.
#
# Local preview:
#   pip install -r docs/requirements.txt
#   mkdocs serve
#
# ═══════════════════════════════════════════════════════════════════════

site_name: VortexUiPro
site_description: "The Ultimate Proxy Management Panel — Next Generation • Enterprise Grade • Multi-Core"
site_author: iPmart Network
site_url: https://ipmartnetwork.github.io/VortexUiPro

repo_name: iPmartNetwork/VortexUiPro
repo_url: https://github.com/iPmartNetwork/VortexUiPro
edit_uri: edit/master/docs/

copyright: "Copyright &copy; 2025 iPmart Network — GNU General Public License v3.0"

# ═══════════════════════════════════════════════════════════════════════
# 🎨 Theme Configuration
# ═══════════════════════════════════════════════════════════════════════
theme:
  name: material
  custom_dir: docs/overrides

  # Brand colors
  palette:
    # Dark mode (default)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  # Site appearance
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/light-bulb-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.tracking

    # Content
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.action.edit
    - content.action.view

    # Search
    - search.suggest
    - search.highlight
    - search.share

    # Table of contents
    - toc.follow

    # Header
    - header.autohide

# ═══════════════════════════════════════════════════════════════════════
# 🔧 Plugins
# ═══════════════════════════════════════════════════════════════════════
plugins:
  - search
  - awesome-pages
  - glightbox
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      cache_safe: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - git-committers:
      repository: iPmartNetwork/VortexUiPro
      branch: master
  - tags:
      tags_file: tags.md
  - social:
      cards_layout_options:
        background_color: "#2D1B69"
  - redirects:
      redirect_maps:
        "wiki/API-Reference.md": "api-reference.md"
        "wiki/Quick-Start.md": "quick-start.md"
        "wiki/Deployment-Guide.md": "deployment-guide.md"
        "wiki/Configuration.md": "configuration.md"
        "wiki/Cluster-Setup.md": "cluster-setup.md"

# ═══════════════════════════════════════════════════════════════════════
# 🔗 Markdown Extensions
# ═══════════════════════════════════════════════════════════════════════
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page

  # PyMdown
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: iPmartNetwork
      repo: VortexUiPro
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path: docs

# ═══════════════════════════════════════════════════════════════════════
# 📋 Navigation Structure
# ═══════════════════════════════════════════════════════════════════════
nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Deployment:
      - deployment-guide.md
      - Docker Compose: deployment-guide.md#docker-compose
      - Production: deployment-guide.md#production-docker-compose
      - Kubernetes Helm: deployment-guide.md#kubernetes-helm
      - SSL Setup: deployment-guide.md#ssl-setup
      - Database: deployment-guide.md#database-options
      - Monitoring: deployment-guide.md#monitoring-setup
  - API Reference:
      - api-reference.md
      - Authentication: api-reference.md#authentication
      - Public Endpoints: api-reference.md#public-endpoints
      - Protected Endpoints: api-reference.md#protected-endpoints
      - Error Codes: api-reference.md#error-codes
      - Data Models: api-reference.md#data-models
  - Configuration:
      - configuration.md
      - Server: configuration.md#server-configuration
      - Database: configuration.md#database-configuration
      - Core Engine: configuration.md#core-engine-configuration
      - Security: configuration.md#security-configuration
      - Cluster: configuration.md#cluster-configuration
      - Subscription: configuration.md#subscription-configuration
  - Cluster Setup: cluster-setup.md
  - Changelog: changelog.md
  - License: license.md
  - GitHub ⚡: https://github.com/iPmartNetwork/VortexUiPro

# ═══════════════════════════════════════════════════════════════════════
# 🌐 Extra Configuration
# ═══════════════════════════════════════════════════════════════════════
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iPmartNetwork/VortexUiPro
      name: View on GitHub
    - icon: fontawesome/brands/telegram
      link: https://t.me/VortexUiPro
      name: Telegram Channel
    - icon: fontawesome/brands/docker
      link: https://github.com/iPmartNetwork/VortexUiPro/pkgs/container/vortexuipro-panel
      name: Docker Images

  generator: false
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback!

  # Version selector (when we have multiple versions)
  version:
    provider: mike
    default: latest

# ═══════════════════════════════════════════════════════════════════════
# 📡 Additional configuration
# ═══════════════════════════════════════════════════════════════════════
extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

# Validation settings
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

# Exclude files from build
exclude_docs: |
  _Sidebar.md
  _Footer.md
  requirements.txt
  overrides/
